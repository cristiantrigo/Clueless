# Despliegue en Render (https://render.com) — proceso Node persistente, con
# WebSockets, que es lo que necesita el juego.
services:
  - type: web
    name: clueless-party
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22"
